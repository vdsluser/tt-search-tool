<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TT Rubber Scout Archive</title><style>
body{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;margin:0;background:#0f172a;color:#e2e8f0}main{max-width:1150px;margin:auto;padding:30px 18px 70px}h1{margin-bottom:4px}.muted,small{color:#94a3b8}.panel,.card{background:#111827;border:1px solid #334155;border-radius:14px;padding:16px;margin:14px 0}.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}label{font-size:.82rem;color:#94a3b8;display:block;margin-bottom:5px}select{width:100%;padding:10px;border-radius:9px;border:1px solid #475569;background:#0f172a;color:#e2e8f0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px}.pill{display:inline-block;background:#1e293b;border-radius:999px;padding:4px 9px;margin:2px;font-size:.82rem}.active{border-color:#60a5fa}.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.rec{padding:10px 0;border-bottom:1px solid #273449}.rec:last-child{border:0}.money{font-variant-numeric:tabular-nums}.empty{padding:35px;text-align:center;color:#94a3b8}a{color:#93c5fd}
</style></head><body><main>
<h1>TT Rubber Scout</h1><p class="muted">누적 러버 리서치 아카이브 · 과거 조사 결과를 삭제하지 않고 버전별로 보존합니다.</p>
<div class="panel"><div class="filters">
<div><label>라켓</label><select id="blade"><option value="">전체</option></select></div>
<div><label>기준 러버</label><select id="reference"><option value="">전체</option></select></div>
<div><label>사용 면</label><select id="side"><option value="">전체</option><option>FH</option><option>BH</option><option value="both">FH / BH</option></select></div>
<div><label>조사 버전</label><select id="version"><option value="">최신 일치 결과</option></select></div>
</div></div>
<div id="count" class="muted"></div><div id="out"></div>
<script>
let reports=[];
const $=id=>document.getElementById(id);
const uniq=a=>[...new Set(a.filter(Boolean))].sort();
const opt=(v,t=v)=>{const o=document.createElement('option');o.value=v;o.textContent=t;return o};
function fill(id,vals,first){const s=$(id),old=s.value;s.innerHTML='';s.append(opt('',first));vals.forEach(v=>s.append(opt(v)));if(vals.includes(old))s.value=old}
function rebuild(){
 const b=$('blade').value,r=$('reference').value;
 const base=reports.filter(x=>(!b||x.blade.model===b)&&(!r||x.reference.display===r));
 fill('blade',uniq(reports.map(x=>x.blade.model)),'전체');
 if(b)$('blade').value=b;
 fill('reference',uniq(reports.filter(x=>!b||x.blade.model===b).map(x=>x.reference.display)),'전체');
 if(r&&[...$('reference').options].some(o=>o.value===r))$('reference').value=r;
 const matches=filter(false); const versions=matches.map(x=>x.report_id);
 fill('version',versions,'최신 일치 결과');
}
function filter(useVersion=true){
 const b=$('blade').value,r=$('reference').value,s=$('side').value,v=$('version').value;
 return reports.filter(x=>(!b||x.blade.model===b)&&(!r||x.reference.display===r)&&(!s||x.constraints.side===s||x.constraints.side==='both')&&(!useVersion||!v||x.report_id===v)).sort((a,b)=>b.research_date.localeCompare(a.research_date));
}
function render(){
 let a=filter(true); if(!$('version').value&&a.length)a=[a[0],...a.slice(1)];
 $('count').textContent='일치하는 누적 리포트 '+a.length+'개';
 $('out').innerHTML=a.length?'':'<div class="empty">조건에 맞는 리포트가 없습니다.</div>';
 a.forEach((x,i)=>{
  const d=document.createElement('section');d.className='card'+(i===0?' active':'');
  const c=x.constraints||{};
  d.innerHTML='<div class="row"><div><span class="pill">'+(x.status==='current'?'현재':'과거')+'</span><span class="pill">'+x.blade.technology+'</span><h2>'+x.title+'</h2></div><div><b>'+x.research_date+'</b><br><small>'+x.report_id+'</small></div></div>'+
  '<p><b>Blade:</b> '+x.blade.brand+' '+x.blade.model+' &nbsp; <b>Reference:</b> '+x.reference.display+'</p>'+
  '<p class="muted">예산 '+(c.budget_krw?c.budget_krw.toLocaleString()+'원':'미기록')+' · 점착 '+(c.tackiness||'미기록')+' · 부스터 '+(c.booster||'미기록')+'</p>'+
  '<p>'+ (x.summary||'') +'</p>'+
  '<h3>추천/결론</h3><div>'+(x.recommendations||[]).map(y=>'<div class="rec">'+(typeof y==='string'?y:JSON.stringify(y))+'</div>').join('')+'</div>'+
  '<h3>가격·유지비 기록</h3><div class="money">'+(x.cost||[]).map(y=>'<div class="rec">'+(Array.isArray(y)?y.join(' · '):y)+'</div>').join('')+'</div>'+
  (x.saturation?'<h3>포화 판정</h3><p>'+x.saturation+'</p>':'')+
  '<p><small>원본 Git 기록: '+x.source_commit+'</small></p>';
  $('out').append(d);
 });
}
['blade','reference'].forEach(id=>$(id).addEventListener('change',()=>{rebuild();render()}));
['side','version'].forEach(id=>$(id).addEventListener('change',render));
fetch('./data/reports.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{reports=d.reports||[];rebuild();render();
 const hash=location.hash.slice(1);if(hash){const x=reports.find(r=>r.report_id===hash);if(x){$('blade').value=x.blade.model;rebuild();$('reference').value=x.reference.display;rebuild();$('version').value=x.report_id;render()}}
}).catch(e=>{$('out').innerHTML='<div class="empty">리포트 데이터를 불러오지 못했습니다: '+e.message+'</div>'});
</script></main></body></html>
